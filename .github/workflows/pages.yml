name: Деплой на GitHub Pages

on:
  push:
    branches: [catalog-crm, GBT, grok]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # sparse-checkout: без media/kb (2,8 ГБ). Чертежи LinkOne публикуем.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            app.js
            analytics.js
            analytics_deck.js
            lookup.js
            styles.css
            schedule.js
            schedule.css
            data
            lib
            media/linkome
            exports

      # Портал + чертёжи LinkOne + график план-факта. Не публикуем PLAN.md,
      # build/, media/kb и сырые прайсы.
      - name: Собрать сайт (только нужные порталу файлы)
        run: |
          mkdir -p _site/media _site/exports
          cp index.html app.js analytics.js analytics_deck.js lookup.js styles.css schedule.js schedule.css _site/
          cp -r data lib _site/
          if [ -d media/linkome ]; then cp -r media/linkome _site/media/; fi
          if [ -d exports ]; then cp -r exports/. _site/exports/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
