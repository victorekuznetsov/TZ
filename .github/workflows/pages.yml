name: Деплой на GitHub Pages

on:
  push:
    branches: [catalog-crm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # sparse-checkout: без media/ (2,8 ГБ полной библиотеки знаний, только для
      # локального скачивания ветки) — иначе каждый деплой качает лишние гигабайты.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            app.js
            styles.css
            data
            lib
            media/linkome

      # Публикуем сам портал (index.html/app.js/styles.css/data/lib) и чертежи
      # LinkOne (media/linkome, 97 МБ — без них в «Каталоге LinkOne» вместо
      # чертежей будут битые картинки). Не публикуем PLAN.md, README.md,
      # build/ (сборка), media/kb (полная библиотека знаний — 2,8 ГБ, только
      # для локально скачанной копии ветки) и сырые прайсы (Прайс-лист ДП/УСО
      # *.xlsx в корне ветки — коммерческие исходники, в рантайме не нужны).
      - name: Собрать сайт (только нужные порталу файлы)
        run: |
          mkdir -p _site/media
          cp index.html app.js styles.css _site/
          cp -r data lib _site/
          cp -r media/linkome _site/media/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
